# Fork only: test and publish the arm64 image of the `custom` branch
# (upstream release + local patches) to ghcr.io/<owner>/bambuddy.
# See CUSTOM_FORK.md.
name: Custom image

on:
  push:
    branches: [custom]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  test:
    name: Test the local patches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-asyncio pytest-timeout httpx "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Lint backend
        run: ruff check backend/

      - name: Backend tests for the patches
        run: |
          python -m pytest -q -p no:cacheprovider \
            backend/tests/unit/test_hidden_filament_presets.py \
            backend/tests/unit/test_ams_color_palette.py \
            backend/tests/unit/test_printer_tags_fork.py \
            backend/tests/integration/test_printer_tags_api_fork.py \
            backend/tests/integration/test_hidden_filament_presets_api.py \
            backend/tests/integration/test_ams_color_palette_api.py \
            backend/tests/integration/test_settings_ui_preferences.py \
            backend/tests/integration/test_settings_ui_flags_3023.py \
            backend/tests/unit/test_octoprint_compat.py \
            backend/tests/integration/test_octoprint_compat_api.py \
            backend/tests/unit/test_route_auth_coverage.py \
            backend/tests/integration/test_library_variant_visibility_3628.py \
            backend/tests/integration/test_library_variants_api.py \
            backend/tests/integration/test_queue_variants_api.py

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks and tests for the patches
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run check:i18n
          npx vitest run \
            src/__tests__/utils/hiddenFilamentPresets.test.ts \
            src/__tests__/utils/amsColorPalette.test.ts \
            src/__tests__/components/AmsColorPalette.test.tsx \
            src/__tests__/components/PrintModalPrinterTags.test.tsx \
            src/__tests__/components/ConfigureAmsSlotModal.test.tsx \
            src/__tests__/components/ConfigureAmsSlotModalWiring.test.tsx \
            src/__tests__/components/ConfigureAmsSlotModalHiddenPresets.test.tsx \
            src/__tests__/pages/SpoolBuddyAmsPageWiring.test.tsx \
            src/__tests__/utils/printPicker.test.ts \
            src/__tests__/components/PrintFromLibraryModal.test.tsx \
            src/__tests__/pages/PrintersPageDropOnBusy.test.tsx \
            src/__tests__/components/PrintModalPerFileMappingRules.test.ts \
            src/__tests__/components/PrintModalSeparateJobsMapping.test.tsx \
            src/__tests__/components/PrintModalSeparateJobs.test.tsx \
            src/__tests__/utils/slicerInbox.test.ts \
            src/__tests__/components/SlicerImportDialog.test.tsx \
            src/__tests__/pages/FileManagerSubfolderCards.test.tsx \
            src/__tests__/pages/FileManagerVariantGroups.test.tsx \
            src/__tests__/pages/FileManagerVariantSelection.test.tsx \
            src/__tests__/pages/fileManager/variantGroups.test.ts \
            src/__tests__/pages/FileManagerPage.test.tsx \
            src/__tests__/components/PrintModalVersionGroupPrinters.test.tsx \
            src/__tests__/components/PrintModalCrossModel.test.tsx \
            src/__tests__/components/PrintModalSeparateJobsQueue.test.ts \
            src/__tests__/components/VariantCandidates.test.tsx

  image:
    name: Build and push arm64 image
    needs: test
    # Native arm64 runner (free for public repositories): no QEMU, so the
    # frontend build takes minutes rather than most of an hour.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Image name and tags
        id: meta
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          version="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' backend/app/core/config.py)"
          image="ghcr.io/${owner}/bambuddy"
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${image}:custom"
            echo "${image}:${version}-custom"
            echo "${image}:${version}-custom-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}-custom
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=custom-image
          cache-to: type=gha,scope=custom-image,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
